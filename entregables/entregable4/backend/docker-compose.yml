services:
  db:
    image: mysql:8.0
    container_name: inventario-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "rootpass"
      MYSQL_DATABASE: "inventario"
      MYSQL_USER: "inventario"
      MYSQL_PASSWORD: "inventario"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_dev.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventario-net

  minio:
    image: minio/minio:latest
    container_name: inventario-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventario-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistema-inventario-backend:latest
    container_name: inventario-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    # Todas las variables aquí - NO hay env_file
    environment:
      DATABASE_URL: "mysql+pymysql://inventario:inventario@db:3306/inventario"
      JWT_SECRET: "jwt-secret-fijo-desarrollo-cambiar-en-produccion-2026"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRES_MINUTES: "480"
      APP_DEBUG: "True"
      APP_ENV: "production"
      APP_PORT: "8000"
      APP_CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "comprobantes"
      IGV_PORCENTAJE: "18"
      MONEDA: "PEN"
    ports:
      - "8000:8000"
    networks:
      - inventario-net
    command: >
      sh -c "sleep 25 && (alembic -c app/infrastructure/persistence/alembic.ini upgrade head || alembic -c app/infrastructure/persistence/alembic.ini stamp head) && uvicorn app.infrastructure.web.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8000/api"
    image: sistema-inventario-frontend:latest
    container_name: inventario-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - inventario-net

volumes:
  mysqldata:
  miniodata:

networks:
  inventario-net:
    driver: bridge